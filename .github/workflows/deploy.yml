name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  # Recompila cada día para publicar los posts con fecha futura cuando llegue su día.
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Solo el tema: cualquier otro submódulo (p. ej. el antiguo public/) no debe
      # mezclarse con la salida de la compilación.
      - name: Checkout theme
        run: git submodule update --init --depth 1 themes/blowfish

      - name: Read Hugo version
        id: hugo
        run: echo "version=$(tr -d '[:space:]' < .hugo-version)" >> "$GITHUB_OUTPUT"

      - name: Install Hugo ${{ steps.hugo.outputs.version }} extended
        run: |
          curl -sSL -o "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${{ steps.hugo.outputs.version }}/hugo_extended_${{ steps.hugo.outputs.version }}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        run: |
          set -o pipefail
          hugo build --gc --minify --environment production --logLevel warn --destination "${{ runner.temp }}/site" 2>&1 | tee build.log
          if grep -qE '^WARN' build.log; then
            echo "::warning::Hugo ha mostrado avisos durante la compilación; revisa el log."
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
