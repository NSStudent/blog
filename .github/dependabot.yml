version: 2
updates:
  # Abre una PR cuando sale una versión nueva de Blowfish. El workflow
  # Deploy compila la PR, así que se ve si rompe algo antes de aceptarla.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "update blowfish theme"
    # public/ apunta a NSStudent.github.io, donde el workflow publica en cada
    # despliegue: no tiene sentido proponer subir su puntero.
    ignore:
      - dependency-name: public

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
