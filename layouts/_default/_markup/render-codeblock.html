{{ $result := transform.HighlightCodeBlock . }}
{{ $result.Wrapped | replaceRE "class=\"chroma\"" "class=\"chroma-custom\"" | safeHTML }}
<script>
document.addEventListener('DOMContentLoaded', () => {
  const updateCodeBlockTheme = () => {
    const isDark = document.documentElement.classList.contains('dark')
    const codeBlocks = document.querySelectorAll('.chroma-custom, .chroma-custom-dark')
    codeBlocks.forEach(block => {
      block.classList.remove('chroma-custom', 'chroma-custom-dark')
      block.classList.add(isDark ? 'chroma-custom-dark' : 'chroma-custom')
    })
  }

  updateCodeBlockTheme()

  const observer = new MutationObserver(updateCodeBlockTheme)
  observer.observe(document.documentElement, {
    attributes: true,
    attributeFilter: ['class']
  })
})
</script>
